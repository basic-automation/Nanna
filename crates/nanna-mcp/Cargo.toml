[package]
name = "nanna-mcp"
version.workspace = true
edition.workspace = true
description = "MCP (Model Context Protocol) client for Nanna"

[features]
default = ["stdio", "http", "tools-integration"]
stdio = ["tokio/process"]
# SSE over reqwest. `tokio-tungstenite` used to be here for a WebSocket
# transport that was never written, and no file ever imported it.
http = ["reqwest", "base64"]
tools-integration = ["nanna-tools", "uuid"]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
async-trait.workspace = true

# HTTP transport (optional)
reqwest = { workspace = true, optional = true }
# The Base64 sentinel Streamable HTTP puts non-header-safe values in.
base64 = { version = "0.23", optional = true }

# For stdio line reading
futures = "0.3"

# A stdio server's whole process tree is killed, not just the launcher
# (`npx`/`uvx`/`sh -c` leave the real server as a grandchild).
nanna-proc = { path = "../nanna-proc" }

# JSON-RPC
uuid = { workspace = true, optional = true }

# Tools integration (optional)
nanna-tools = { path = "../nanna-tools", optional = true }
