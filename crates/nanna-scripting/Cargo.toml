[package]
name = "nanna-scripting"
version.workspace = true
edition.workspace = true
description = "JavaScript/TypeScript scripting engine for Nanna tools"

[features]
default = ["boa"]
boa = ["boa_engine"]
python = ["rustpython-vm", "rustpython-stdlib", "rustpython-pylib"]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
chrono.workspace = true
reqwest.workspace = true
url = "2"
walkdir = "2"
directories.workspace = true

# Tree-kill + per-child Job Object for exec timeouts (bridge.rs
# exec_with_timeout): kill_process_tree reaps a live tree; ChildJob reaps a
# detached grandchild whose shell already exited (the `foo &` shape).
nanna-proc = { path = "../nanna-proc" }

# Boa - Pure Rust JS engine (lightweight)
# Back on crates.io as of 0.22.0 (2026-08-28), which retires the git pin this
# dep carried since 2026-07-10. The pin existed because the then-latest release
# (0.21.1) held icu ~2.0 against a tree on icu 2.2; 0.22.0 requires icu ~2.3
# and pulls the whole tree forward to a single 2.3.x, so the conflict is gone
# in the other direction. boa_runtime was dropped at the same time: it was an
# optional dep that no source file has ever referenced.
boa_engine = { version = "0.22", optional = true }

# The V8 (Deno) engine was an optional dependency set (`deno_core`, `deno_ast`,
# `deno_error`) behind a `deno` feature no crate enabled; deleted 2026-10-08.

# RustPython - Embedded Python interpreter (no system Python needed)
rustpython-vm = { version = "0.6", default-features = false, features = ["compiler", "encodings", "freeze-stdlib"], optional = true }
rustpython-stdlib = { version = "0.6", optional = true }
rustpython-pylib = { version = "0.6", features = ["freeze-stdlib"], optional = true }

[dev-dependencies]
tempfile = "3"
