[package]
name = "nanna-scripting"
version.workspace = true
edition.workspace = true
description = "JavaScript/TypeScript scripting engine for Nanna tools"

[features]
default = ["boa"]
boa = ["boa_engine"]
deno = ["deno_core", "deno_ast", "deno_error"]
python = ["rustpython-vm", "rustpython-stdlib", "rustpython-pylib", "malachite-bigint"]
full = ["boa", "deno"]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
chrono.workspace = true
reqwest.workspace = true
url = "2"
walkdir = "2"
directories.workspace = true

# Tree-kill + per-child Job Object for exec timeouts (bridge.rs
# exec_with_timeout): kill_process_tree reaps a live tree; ChildJob reaps a
# detached grandchild whose shell already exited (the `foo &` shape).
nanna-proc = { path = "../nanna-proc" }

# Boa - Pure Rust JS engine (lightweight)
# Back on crates.io as of 0.22.0 (2026-08-28), which retires the git pin this
# dep carried since 2026-07-10. The pin existed because the then-latest release
# (0.21.1) held icu ~2.0 against a tree on icu 2.2; 0.22.0 requires icu ~2.3
# and pulls the whole tree forward to a single 2.3.x, so the conflict is gone
# in the other direction. boa_runtime was dropped at the same time: it was an
# optional dep that no source file has ever referenced.
boa_engine = { version = "0.22", optional = true }

# Deno - V8-based (full featured fallback)
deno_core = { version = "0.412", optional = true }
deno_ast = { version = "0.53", features = ["transpiling"], optional = true }
deno_error = { version = "0.7", optional = true }

# NOTE: the old direct `swc_core` dep ("TypeScript transpilation for Boa") was
# dead — nothing in this crate referenced it, no feature enabled it, and its
# version conflicted with deno_ast 0.53's exact swc pins. TS transpilation for
# the Deno path comes from deno_ast's own bundled swc.

# RustPython - Embedded Python interpreter (no system Python needed)
rustpython-vm = { version = "0.5", default-features = false, features = ["compiler", "encodings", "freeze-stdlib"], optional = true }
rustpython-stdlib = { version = "0.5", optional = true }
rustpython-pylib = { version = "0.5", features = ["freeze-stdlib"], optional = true }

# Transitive-version pin (not imported directly) — same lever as `aegis` in
# nanna-storage. `rustpython-stdlib` reaches malachite-bigint by two paths that
# must agree: `rustpython-common` holds it at 0.9, while `pymath 0.2` accepts
# 0.10. When plain `cargo update` takes 0.10 for pymath the graph carries TWO
# malachite-bigint versions, so `malachite_bigint::{BigInt,BigUint}` names two
# distinct types inside one crate and rustpython-stdlib stops compiling.
#
# This has been rediscovered and hand-repaired on three consecutive dependency
# sweeps (2026-08-22/23/24) because a lockfile pin is exactly what `cargo
# update` is entitled to move. A manifest constraint is not, so the repair is
# stated here once instead of being re-derived every run. Drop it when
# rustpython ships a release whose paths agree on one malachite (track
# `rustpython-common`'s requirement, not pymath's).
# Optional so it never enters a build that has no Python; the version
# constraint still binds the lockfile either way, which is the point.
malachite-bigint = { version = "=0.12.0", optional = true }

[dev-dependencies]
tempfile = "3"
