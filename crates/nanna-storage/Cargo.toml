[package]
name = "nanna-storage"
version.workspace = true
edition.workspace = true

[dependencies]
nanna-numeric = { path = "../nanna-numeric" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true

# Turso — pure-Rust, SQLite-compatible embedded DB (the ONLY database).
# Pinned exactly: turso is pre-1.0, so a minor/patch bump can break the build.
# `pure-rust-crypto` selects `aegis/pure-rust`: without it aegis's build.rs compiles
# bundled C (clang-cl on MSVC, absent on a stock Windows toolchain). turso's defaults
# enable it today; naming it here keeps that true if a release drops it from them.
# It replaces the old exact `aegis` pin, which froze a version to dodge that C build.
# `default-features = false` drops `fts` (Nanna has no full-text index): turso_core
# 0.8.1's FTS directory calls `DynVec::new_in(DynAllocator)`, which only type-checks
# under `--cfg nightly`, so with `fts` on it does not compile here (turso#9463). Dropping it also
# drops `tantivy` and its unsound `lru 0.16` (RUSTSEC-2026-0253).
# `mimalloc` is OFF, as a measured decision (2026-10-04), not an accident: turso's
# `mimalloc` feature installs C mimalloc as the `#[global_allocator]` of every binary
# that links this crate, so it chooses the whole daemon's allocator. Against the
# system allocator (release build, same tree, both orders run): the in-RAM recall
# scan at 50k memories took 11.2 ms vs 4.7 ms (it runs on every recall and every
# ingest), `bulk_load` at 50k 121 ms vs 181 ms (once per boot), and a boot on a real
# 105 MB store peaked at ~295 MB vs ~232 MB RSS but idled at ~185 MB vs ~237 MB.
# The hot path wins, and no C allocator is built. Re-measure before turning it on.
turso = { version = "=0.8.1", default-features = false, features = ["pure-rust-crypto"] }
