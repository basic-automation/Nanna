[package]
name = "nanna-gpu"
version.workspace = true
edition.workspace = true

[dependencies]
wgpu.workspace = true
tracing.workspace = true
thiserror.workspace = true
bytemuck = { version = "1.25", features = ["derive"] }
futures = "0.3"

[[bench]]
name = "gpu_vs_simd"
harness = false

[[bench]]
name = "gpu_vs_simd_quick"
harness = false

[[bench]]
name = "gpu_vs_simd_extended"
harness = false

[[bench]]
name = "threshold_benchmark"
harness = false

[dev-dependencies]
nanna-numeric = { path = "../nanna-numeric" }
nanna-simd = { path = "../nanna-simd" }
tokio = { version = "1.53", features = ["full"] }
