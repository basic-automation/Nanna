[package]
name = "nanna-llm"
version.workspace = true
edition.workspace = true

[features]
default = ["tiktoken"]
auto-refresh = ["nanna-config"]
# Exact OpenAI BPE counts via tiktoken-rs (o200k_base / cl100k_base).
# The default heuristic remains always available and is used as a fallback.
tiktoken = ["dep:tiktoken-rs"]

[dependencies]
nanna-numeric = { path = "../nanna-numeric" }
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
futures = "0.3"
async-stream = "0.3"
directories = "6"
# `Retry-After` as an HTTP-date (RFC 9110 allows it); already in the graph via hyper.
httpdate = "1"

# Optional: for OAuth auto-refresh
nanna-config = { path = "../nanna-config", optional = true }

# Optional exact OpenAI token counting
tiktoken-rs = { version = "0.12", optional = true }

[dev-dependencies]
# `start_paused` virtual-time tests for the OpenRouter request-spacing gate —
# real 3s sleeps in tests would be the slow alternative.
tokio = { workspace = true, features = ["test-util"] }
# Captures the num_ctx pin announcement in tests — the log line is part of
# the contract (silent pins are how operators chase phantom sizing bugs).
tracing-subscriber.workspace = true
