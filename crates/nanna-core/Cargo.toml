[package]
name = "nanna-core"
version.workspace = true
edition.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
flume.workspace = true
uuid.workspace = true

nanna-simd = { path = "../nanna-simd" }
nanna-gpu = { path = "../nanna-gpu" }
nanna-llm = { path = "../nanna-llm" }
nanna-channels = { path = "../nanna-channels" }
nanna-memory = { path = "../nanna-memory" }
nanna-storage = { path = "../nanna-storage" }
# Shared workspace types — in particular the one `GitContext` implementation, so
# this crate and `nanna-workspace` cannot drift on what a git snapshot is.
nanna-workspace = { path = "../nanna-workspace" }

chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
# `start_paused` for the scheduler's timer tests (as nanna-llm/nanna-daemon do).
tokio = { workspace = true, features = ["test-util"] }
