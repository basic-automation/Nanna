[package]
name = "nanna-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nanna daemon - headless background service with IPC server"

[[bin]]
name = "nanna-daemon"
path = "src/main.rs"

[lib]
name = "nanna_daemon"
path = "src/lib.rs"

[dependencies]
nanna-numeric = { path = "../nanna-numeric" }
# Internal crates
nanna-core = { path = "../nanna-core" }
nanna-agent = { path = "../nanna-agent" }
# `vision` is what makes `vision_wiring` compile at all, and no crate in the
# workspace enabled it — which is the structural reason `create_vision_tool`
# had no callers anywhere. It costs nothing to turn on: `vision = ["nanna-llm"]`
# and this crate already depends on nanna-llm directly for the router.
nanna-tools = { path = "../nanna-tools", features = ["scripting", "python", "vision", "browser"] }
nanna-channels = { path = "../nanna-channels" }
nanna-config = { path = "../nanna-config" }
nanna-storage = { path = "../nanna-storage" }
nanna-llm = { path = "../nanna-llm" }
nanna-memory = { path = "../nanna-memory" }
nanna-timeline = { path = "../nanna-timeline" }
nanna-mcp = { path = "../nanna-mcp" }
# Kill-on-close Job Object adoption (job.rs re-export; implementation shared
# with the exec tool's and acceptance runner's per-child containment).
nanna-proc = { path = "../nanna-proc" }
nanna-scripting = { path = "../nanna-scripting", features = ["python"] }

# Workspace deps
tokio.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
uuid.workspace = true
chrono.workspace = true
axum.workspace = true

# IPC / WebSocket
tokio-tungstenite = "0.30"
futures-util = "0.3"

# HTTP server for health endpoint
tower-http = { version = "0.7", features = ["cors", "trace"] }

# Socket options (SO_REUSEADDR for fast restart)
socket2 = "0.6"

# Webhook signature verification (Discord Ed25519, Slack HMAC-SHA256)
ed25519-dalek = "3.0"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
# Constant-time equality for the Telegram webhook secret (already in the tree via
# aes-gcm/ed25519); pinned direct so the crypto-comparison intent is explicit.
subtle = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Ollama runner reset (keep_alive=0) in the long-horizon step runner
reqwest.workspace = true

# Test-only helpers
[dev-dependencies]
tempfile = "3"
# Test-only: builds a real multi-page PDF in memory so the `pdf.read`
# service is proven against a parsed document rather than a fixture blob.
# Same version nanna-tools already resolves, so it adds no graph entry.
lopdf = "0.45"
# Test-only: paused time, so the channel typing keepalive's 4 s refresh and
# 60 s abandonment are tested without a minute of wall clock. nanna-llm already
# enables it, so it adds no graph entry.
tokio = { workspace = true, features = ["test-util"] }

# Platform services
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
# Process-liveness check for the PID-file single-instance guard.
# (Shelling out to `tasklist` mis-reported live PIDs as dead when the
# subprocess failed, letting a second daemon clobber the lock.)
# The kill-on-close Job Object machinery moved to nanna-proc; only health.rs
# uses windows-sys here now.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
