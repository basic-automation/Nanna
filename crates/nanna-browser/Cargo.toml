[package]
name = "nanna-browser"
version.workspace = true
edition.workspace = true

[features]
default = ["cdp"]
cdp = ["chromiumoxide", "tempfile"]
playwright = ["playwright-rs"]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures = "0.3"

# Browser automation via CDP (optional)
# 0.9 is tokio-only; the old `tokio-runtime` feature no longer exists.
chromiumoxide = { version = "0.9", optional = true }
# Each launched browser gets its own profile directory (see cdp::CdpBrowser).
tempfile = { version = "3", optional = true }

# Playwright for multi-browser support (Firefox, WebKit, Chromium)
playwright-rs = { version = "0.19", optional = true }

