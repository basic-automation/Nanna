# Pinned to a nightly VERIFIED to compile this workspace in the *release* profile.
#
# History of why a pin exists at all (both failures are release-codegen/const-eval only;
# debug builds, tests and clippy are unaffected by either):
#
# - nightly 2026-07-23 (89c61a754) ICEd in rustc_codegen_ssa compiling `tokio` under our
#   release profile (`lto = "fat"`, `codegen-units = 1`, `panic = "abort"`), which forced
#   the previous pin nightly-2026-07-13.
# - nightly-2026-07-13 in turn FAILS release builds as of 2026-08-14: recompiling
#   `turso_core 0.6.1` (forced by a dependency-freshness pass) hits "queries overflow the
#   depth limit" simplifying a `from_repr` discriminant constant. The failure was latent
#   while a cached rlib existed, so "the pin built fine yesterday" proves nothing after
#   any bump that dirties turso_core.
#
# This channel (rustc 1.101.0-nightly, commit c36f14571) builds `cargo build --release
# -p nanna-daemon` green — verified in 9m43s on 2026-10-02, from a cold target dir —
# with no tokio ICE and no turso depth overflow, and the full gate was re-run under it
# (clippy 0 warnings / 0 errors after two new-lint fixes, see below).
# (The previous pin, nightly-2026-09-28 / d080e7dff, was verified the same way in 8m12s
# on 2026-09-29; nightly-2026-09-20 / feaadeeac in 9m06s
# on 2026-09-20; nightly-2026-09-17 / 923c95cdf in 7m35s on 2026-09-18; nightly-2026-09-08 /
# cea272fa3 in 8m33s on 2026-09-09; nightly-2026-08-27 / bff8e12ff in 20m08s on 2026-08-27.)
#
# What moving to 2026-10-02 cost: two lints newly firing on old code —
# `items_after_test_module` (nanna-storage's lib.rs had items after its test module;
# the module moved to the end) and `needless_borrows_for_generic_args` (`.map(&f)` on a
# capture-free, hence `Copy`, closure). Both fixes build on both channels.
#
# What moving this pin cost, recorded because the next mover will hit the same thing:
# the newer clippy reported 58 warnings where the old one reported 21, almost all of
# them `clippy::map_unwrap_or` newly firing on `map(f).unwrap_or_default()`. That is a
# lint change, not a code regression — it was cleared by taking the machine-applicable
# `map_or_default` rewrites (22 sites), which build on BOTH channels. Expect a warning
# jump on the next move too, and check whether it is new lints before assuming it is
# new breakage.
#
# NOTE for whoever moves this next: the pin does NOT control cargo's build-script
# output layout, and that layout is what currently breaks the Tauri GUI build on
# Linux (tauri-build 2.6.3 assumes `debug/build/<crate>-<hash>/out`; this cargo emits
# `debug/build/<crate>/<hash>/out`). Moving the pin neither caused nor fixes it — see
# the Linux host blockers section in ROADMAP.md.
#
# Future-incompatible warnings under this channel, and what they are NOT:
# - `attribute-derive-macro 0.10.5` — "trailing semicolon in macro used in expression
#   position" (rust#79813). It is FIVE levels down a rustpython chain
#   (rustpython-pylib → …-codegen → …-ruff_python_ast → get-size2 → get-size-derive2 →
#   attribute-derive), so there is nothing to fix at this end and no version of ours to
#   bump. A warning, not an error; recorded so a future run does not mistake it for new
#   breakage in our own code.
# - The previous pin's `recursion_depth_exceeding_limit` (rust#159228) is already
#   answered by `#![recursion_limit = "256"]` on the daemon crate roots.
#
# On each dependency-freshness pass: try the current nightly with a full
# `cargo build --release -p nanna-daemon`; if green, move this pin (and the mirrored
# `toolchain:` inputs in .github/workflows/{budget-gate,release-check,test-compile}.yml —
# release-check was missing from this list until 2026-08-26) forward to it.
[toolchain]
channel = "nightly-2026-10-02"
components = ["rustfmt", "clippy"]
