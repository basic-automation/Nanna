# Smoke check: the test code must still compile.
#
# The failure this exists to catch (2026-07-06): the full-workspace `cargo test`
# did not compile at all — missing `tempfile` dev-deps, a stale `ChannelId`
# import, test initializers referencing fields that had been removed, and a
# `DaemonConfig` field omission that was a *production* build break. None of it
# was noticed, because nothing ran the tests on a schedule anyone watched.
#
# `--no-run` builds every test target without executing it: it catches drift
# cheaply and cannot fail for flaky-runtime reasons, which is what makes it a
# smoke check rather than a test suite.
name: test-compile

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: test-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-tests:
    # Windows on purpose: it is the platform this workspace is developed and
    # pinned against (MSVC toolchain, `aegis` on the pure-Rust path, the
    # `windows-service` integration). A Linux runner would not exercise the
    # `#[cfg(windows)]` code, which is where the service layer lives.
    #
    # That reasoning is still correct and is why this job stays — but it is only
    # half the picture, and the missing half was expensive. See
    # `compile-tests-linux` below.
    runs-on: windows-latest
    # Measured: 16m12s on the first run, with a completely cold cache
    # (run 29557077493). 30 gave ~2x headroom for a dependency bump that
    # invalidates everything, while still killing a hang in reasonable time.
    # Re-measure if the graph grows; do not raise it to paper over a hang.
    #
    # Re-measured 2026-09-18: the graph has grown (MCP 2026-07-28 over every
    # transport, the reference-SDK interop crates, the GUI startup work) and a
    # cold build no longer fits in 30. Run 35392894354 was not hung: it
    # compiled steadily through 754 crates, reached the root `nanna` crate 18
    # minutes in, and was still compiling and linking its test targets when
    # the limit cancelled it at 28. Cancellation also skips the cache save, so
    # every retry started cold again: a limit a cold build cannot meet never
    # heals. The next cold run (35395737558, "No cache found") finished: the
    # compile step took 20m26s and the job 26m01s with the cache save, so a
    # cold build now runs 20-30 minutes depending on the runner. 60 is ~2x the
    # slower of the two.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # dtolnay/rust-toolchain reads its `toolchain` input, not
      # rust-toolchain.toml, so the pinned channel is passed explicitly rather
      # than `@nightly`. Keep it in lockstep with rust-toolchain.toml — that
      # file carries the pin's rationale and the condition for removing it.
      # (The channel below is nightly-2026-09-20; an earlier version of this
      # comment still named the superseded nightly-2026-07-13 pin.)
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-20

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Distinguish this job's cache from any future workflow's.
          key: test-compile

      # `nanna-gui` is excluded deliberately, not out of convenience: its
      # build.rs needs two artifacts the repo does not commit — the Tauri sidecar
      # binary (`gui/src-tauri/binaries/nanna-daemon-<triple>.exe`) and the built
      # frontend at `gui/.output/public`. Building it here would mean running the
      # full pnpm + daemon build, which is a packaging job, not a smoke check.
      - name: Compile all test targets
        run: cargo test --no-run --workspace --exclude nanna-gui --locked

  # The mirror of the job above, and the reason it exists (2026-09-07): on Linux
  # this workspace **did not compile at all**, and had not since the dev host
  # moved to Linux in September. Two independent breaks, neither of which any
  # amount of Windows CI could see:
  #
  #   1. `bridge.rs` selected the exec shell with `cfg!(windows)` — a *runtime*
  #      boolean — so both arms were type-checked everywhere while the Windows
  #      arm's helpers are `#[cfg(windows)]` and absent on Linux (5x E0425/E0433).
  #   2. `libc >= 0.2.187` retyped `POSIX_SPAWN_SETSID` to `c_short`, which
  #      `rustpython-vm 0.5.0` hands to a `c_int` bitflags ctor (E0308), killing
  #      the `python` feature.
  #
  # Both are plain compile errors, so `--no-run` on a Linux runner would have
  # caught each of them on the commit that introduced it. The job above cannot,
  # by construction: a platform gate is only tested by the platform it excludes.
  #
  # `nanna-gui` is excluded here for the same reason as above, plus one more:
  # the Tauri crate needs WebKitGTK system packages on Linux, which would turn
  # this smoke check into a provisioning job. Linux GUI coverage lives in its
  # own job, `check-gui-linux`, which pays for that provisioning separately.
  compile-tests-linux:
    name: Compile all test targets (Linux)
    runs-on: ubuntu-latest
    # Matches the Windows job's bound: the shared dependency graph dominates and
    # is the same graph. Re-measure rather than raise if it starts timing out.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Same pin as every other job here; keep in lockstep with
      # rust-toolchain.toml, which carries the rationale.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-20

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: test-compile-linux

      - name: Compile all test targets
        run: cargo test --no-run --workspace --exclude nanna-gui --locked

  # `nanna-gui` is excluded above, so until this job existed **nothing in CI
  # compiled it at all** — and `gui.yml` only triggers on `gui/**` paths, so a
  # change under `crates/` that broke `gui/src-tauri/src/**` reached neither
  # workflow's Rust coverage.
  #
  # That is not hypothetical. On 2026-08-23 `nanna-gui` was found broken on this
  # branch: adding `webhook_secret` to `TelegramConfig`/`SignalConfig` in
  # `nanna-config` updated three of the four construction sites, and the fourth
  # (`gui/src-tauri/src/commands/channels.rs`) failed with two E0063s. Every
  # existing gate was green, because every existing gate skips this crate.
  #
  # The exclusion above cites a real obstacle — `nanna-gui`'s build needs two
  # artifacts the repo does not commit — but both can be **stubbed**, which is
  # what makes this job cheap. Measured locally: a 4-byte placeholder sidecar
  # and a one-line `index.html` are enough for `cargo check -p nanna-gui` to run
  # the real typecheck. No `pnpm build`, no daemon build.
  check-gui:
    name: Typecheck nanna-gui
    runs-on: windows-latest
    # Measured at 55s for the check itself once the shared dependency graph is
    # built; that graph dominates, so this matches the job above's bound for it.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-20

      - uses: Swatinem/rust-cache@v2
        with:
          key: check-gui

      # Stubs, deliberately: this job typechecks Rust, it does not package an
      # app. The sidecar only has to exist for Tauri's externalBin resolution,
      # and `frontendDist` only has to be a directory for `generate_context!`
      # not to panic. Packaging is `release.yml`'s job, with the real artifacts.
      - name: Stub the two uncommitted build artifacts
        shell: bash
        run: |
          mkdir -p gui/src-tauri/binaries gui/.output/public
          printf 'stub' > gui/src-tauri/binaries/nanna-daemon-x86_64-pc-windows-msvc.exe
          printf '<!doctype html><title>stub</title>' > gui/.output/public/index.html

      - name: Typecheck the GUI crate
        run: cargo check --package nanna-gui --locked

      # tauri-build copies the sidecar next to the app binary from its build
      # script. Under cargo's build-dir layout v2 the stock 2.6.3 put it in
      # `target/debug/build/` instead — silently here, because the `.exe` name
      # collides with nothing. See `check-gui-linux`; fixed upstream in 2.7.0.
      - name: Assert the sidecar landed beside the app binary
        shell: bash
        run: |
          test -f target/debug/nanna-daemon.exe
          test ! -e target/debug/build/nanna-daemon.exe

  # The Linux mirror of `check-gui`, added 2026-09-10 after `nanna-gui` turned
  # out not to build on Linux (or macOS) at all: tauri-build 2.6.3 located the
  # target dir by a fixed walk up from OUT_DIR, which cargo's build-dir layout
  # v2 (nightly default, stable in 1.100) made one level short, and its
  # `copy_binaries` then panicked with IsADirectory on `build/nanna-daemon`.
  # Nothing caught it because nothing compiled this crate on Linux.
  #
  # The placement assertion is the part that makes this job catch that class on
  # a *fresh* runner: the panic needs a pre-existing `build/nanna-daemon/`
  # directory (a dev tree that has built the daemon), but the misplaced copy
  # happens every time. Verified locally both ways: with the stock 2.6.3 the
  # check passes and the assertion fails; with tauri-build >= 2.7.0 both pass.
  check-gui-linux:
    name: Typecheck nanna-gui (Linux)
    runs-on: ubuntu-latest
    # Same bound as `check-gui`: the shared dependency graph dominates.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-20

      - uses: Swatinem/rust-cache@v2
        with:
          key: check-gui-linux

      # The WebKitGTK stack Tauri links on Linux; the same set `release.yml`'s
      # Linux job installs, minus the packaging-only tools.
      - name: Install WebKitGTK system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Stub the two uncommitted build artifacts
        run: |
          mkdir -p gui/src-tauri/binaries gui/.output/public
          printf 'stub' > gui/src-tauri/binaries/nanna-daemon-x86_64-unknown-linux-gnu
          chmod +x gui/src-tauri/binaries/nanna-daemon-x86_64-unknown-linux-gnu
          printf '<!doctype html><title>stub</title>' > gui/.output/public/index.html

      - name: Typecheck the GUI crate
        run: cargo check --package nanna-gui --locked

      - name: Assert the sidecar landed beside the app binary
        run: |
          test -f target/debug/nanna-daemon
          test ! -e target/debug/build/nanna-daemon/nanna-daemon
          test ! -f target/debug/build/nanna-daemon

  # The NEON path is compiled on no other job and was once shipped broken
  # (trailing semicolons, 2026-09-26) and lint-dirty for months. This RUNS its
  # tests, not just compiles them: the musl target links with the toolchain's
  # own `rust-lld` (no cross C toolchain) and executes under qemu-user.
  # `nanna-simd` is pure Rust, so the whole job is seconds of compile.
  simd-aarch64:
    name: nanna-simd on aarch64 (qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-20
          targets: aarch64-unknown-linux-musl,aarch64-unknown-linux-gnu
          components: clippy

      - name: Install qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Clippy on aarch64
        run: cargo clippy -p nanna-simd --target aarch64-unknown-linux-gnu --all-targets --locked -- -D warnings

      - name: Run the NEON tests under qemu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER: qemu-aarch64-static
        run: cargo test -p nanna-simd --target aarch64-unknown-linux-musl --locked
