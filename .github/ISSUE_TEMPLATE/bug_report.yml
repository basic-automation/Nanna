name: Bug report
description: Something in Nanna does not work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search [existing issues](https://github.com/basic-automation/Nanna/issues) first.
        **Do not paste API keys, bot tokens, or `config.toml` secrets** — redact them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nanna version
      description: Shown in Settings, or `nanna --version`. For a source build, the commit.
      placeholder: 0.3.30-beta.39
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Windows installer (.exe)
        - Linux AppImage
        - Linux .deb
        - Built from source
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and provider
      description: e.g. `ollama/qwen3.5:9b` on a local GPU, or Anthropic / OpenRouter.
  - type: textarea
    id: doctor
    attributes:
      label: "`nanna doctor` output"
      description: Run `nanna doctor` and paste the output.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: From the app's Logs page or the data directory's `logs/`. Redact anything private.
      render: text
