source = "nanna_memory::retention::tests::dreaming_shrinks_store_while_holding_recall"
note = "recall@3 held 1.0 -> 1.0 across a dream cycle; same-topic merges keep every topic reachable."

[[budget]]
id = "dreaming.summarizer_calls"
