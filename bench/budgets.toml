# Machine-readable performance budgets.
# The committed gate the daily-dev routine and (eventually) CI diff against.
# Human-readable rationale lives in the document named by `baseline_doc`.
#
# Schema:
#   id        — stable key, dotted as `<suite>.<metric>`
#   suite     — one of `nanna_bench::Suite::id()`:
#               inference | vector_search | dreaming | agent_loop | guardrails | efficiency
#   metric    — the measured quantity
#   direction — "min" (measured >= value) | "max" (measured <= value) | "exact" (measured == value)
#   value     — the budget threshold
#   source    — the test that produces the number
#   note      — one line of context; see BASELINE.md for the full rationale

version = 1
baseline_doc = "bench/BASELINE.md"

# --- Suite 3 — Dreaming & compression -----------------------------------------

[[budget]]
id = "dreaming.compression"
suite = "dreaming"
metric = "compression"
direction = "min"
value = 0.90
source = "nanna_memory::retention::tests::dreaming_shrinks_store_while_holding_recall"
note = "60 -> 6 memories on the fixed-seed corpus; deterministic, hardware-independent."

[[budget]]
id = "dreaming.recall_retention"
suite = "dreaming"
metric = "recall_retention"
direction = "min"
