[package]
name = "nanna-gui"
version.workspace = true
description = "Nanna AI Assistant - Desktop GUI"
authors = ["Nanna Team"]
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nanna_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
nanna-numeric = { path = "../../crates/nanna-numeric" }
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-shell.workspace = true
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Only with the `e2e-webdriver` feature (see [features]).
tauri-plugin-webdriver = { version = "0.2.3", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true

# Async utilities (futures-util backs the WebSocket daemon client)
futures-util = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# WebSocket for daemon connection
tokio-tungstenite = "0.30"

# HTTP client for embeddings API
reqwest.workspace = true

# TOML for config export/import
toml = "1.1"

# YAML for skill manifests
serde_yaml = "0.9"

# PKCE OAuth flow
base64 = "0.23"
sha2 = "0.11"
urlencoding = "2.1"
rand = "0.10"


# Directories for fallback paths
directories.workspace = true

# Nanna crates the daemon *client* needs. The GUI is a pure daemon client, so it
# links only: nanna-config (config cache read/write + credential manager),
# nanna-core (cron parsing/description, workspace registry cache + folder
# constants, and the relocated log_buffer), and — Windows-only, below —
# nanna-proc (sidecar tree-kill). All
# heavy subsystems (storage, memory, agent loop, scheduler, LLM
# routing, channels) live in the daemon and are reached over IPC.
nanna-core = { path = "../../crates/nanna-core" }
nanna-config = { path = "../../crates/nanna-config" }

[target.'cfg(windows)'.dependencies]
# Shared taskkill /T walk for tree-killing the daemon sidecar the GUI manages
# (daemon_manager.rs). Windows-only on purpose: the Unix path there is a
# deliberate no-op, because the sidecar is not spawned as a process-group
# leader and the process_group(0) contract behind nanna-proc's group kill does
# not hold.
nanna-proc = { path = "../../crates/nanna-proc" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# NOT in `default`: this feature opens the webview inspector in *release* builds, on an app that
# renders model output and untrusted markdown. Tauri enables devtools automatically under
# `debug_assertions`, so `tauri dev` is unaffected — build with `--features devtools` to get the
# inspector in a release build deliberately.
devtools = ["tauri/devtools"]
# NOT in `default`, and never enabled by `release.yml`: embeds a W3C WebDriver server in the app
# (127.0.0.1:4445, reached through the `tauri-webdriver` intermediary on :4444) so the app can be
# driven end to end on Linux, where no `WebKitWebDriver` matching WebKitGTK 4.1 exists. A shipped
# build with it would carry a remote-control port — build with `--features e2e-webdriver` only for
# automated verification (CI, the nightly routine).
e2e-webdriver = ["dep:tauri-plugin-webdriver"]

[dev-dependencies]
tempfile = "3"
# `tauri::test`: a mock app, so unit tests can run the sidecar lifecycle
# (daemon_manager.rs) against a stand-in process through the real shell plugin.
tauri = { workspace = true, features = ["test"] }
